name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-oracle:
    name: Build, Unit Tests & Pure Zig Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # grep 3.12 y xz ya vienen en la imagen ubuntu-26.04. Si apt no llega a
      # los mirrors (2026-11-11: tres corridas seguidas sin DNS para
      # *.ubuntu.com), ripgrep 15.1.0 -- la misma version que trae apt -- se
      # baja de su release oficial con el sha256 fijado; github.com si
      # resuelve, el checkout acaba de usarlo.
      - name: Install dependencies (ripgrep & GNU grep)
        run: |
          if sudo apt-get update && sudo apt-get install -y grep ripgrep xz-utils; then
            exit 0
          fi
          echo "apt fallo: ripgrep 15.1.0 desde la release oficial"
          rg_tgz=ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$rg_tgz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$rg_tgz"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/$rg_tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$rg_tgz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/ripgrep-15.1.0-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          command -v grep xz rg

      - name: Setup Zig 0.16.0
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /usr/local
          echo "/usr/local/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          zig version
          grep --version | head -1
          rg --version | head -1

      - name: Build zigrep (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      # El nombre NO cifra cuantos tests hay: esa cifra se mueve cada vez que
      # se anade uno (ya paso con 56 y con 64). El numero real lo imprime
      # `zig build test --summary all`. En Linux se salta el test de la sonda
      # fuera de Linux; en Windows se salta el de la fusion (que es Linux-only)
      # y corre el de la sonda, que alli contesta `unsupported`.
      - name: Run unit tests
        run: zig build test --summary all

      - name: Run pure Zig differential oracle vs GNU grep & ripgrep
        run: zig build oracle

      # M3: el lote debe ser byte a byte N procesos separados, y el truncado un
      # prefijo con `omitted` exacto. El corpus no se versiona: se regenera con
      # la semilla de su .truth (byte-identico, verificado). El oraculo instala
      # un Debug en zig-out: recompilar antes de medir nada.
      - name: Batch & budget conformance (M3)
        run: |
          zig run scripts/gen_corpus.zig -- --out=bench-corpus/corpus_50 --files=50 --size=32768 --seed=20261108
          zig build -Doptimize=ReleaseFast
          python3 evidence/agent-native/batch_conformance.py

      # M4: --provenance aditivo, uno por fichero y antes de sus eventos, y
      # sha256/size/mtime_ns verificados contra hashlib/os.stat en todos los
      # caminos de lectura. Usa el corpus_50 del paso anterior.
      - name: Provenance conformance (M4)
        run: python3 evidence/agent-native/provenance_conformance.py

      # M5: --json=compact (zgrep/1c) decodifica EXACTAMENTE a zgrep/1 (todos
      # los modos, caminos, procedencia, stdin y lote) y pesa menos.
      - name: Compact JSON conformance (M5)
        run: python3 evidence/agent-native/compact_conformance.py

      # M8: lo emitido + el spill reconstruye exactamente la salida sin
      # presupuesto; hash/bytes/0600 verificados; nunca silencioso.
      - name: Spill conformance (M8)
        run: python3 evidence/agent-native/spill_conformance.py

      # M9: --max-columns recorta la linea larga a una ventana alrededor del
      # match sin perder nada. El diferencial lo comprueba contra el FICHERO en
      # disco (la ventana son bytes reales de la linea), exige que el match
      # nunca se corte, que una fila sin match (contexto/-v/passthru) y una de
      # --replace salgan enteras, que ningun caracter UTF-8 se parta y que sin
      # la bandera no cambie ni un byte. Corre sobre el fixture determinista de
      # evidence/agent-native/m9/fix (make_fixture.py + SHA256SUMS.txt).
      - name: Long-line windows conformance (M9)
        run: python3 evidence/agent-native/m9_conformance.py

      # --include/--exclude con la sintaxis de globs de rg (llaves, **, clases,
      # rutas relativas a la raiz): mismo conjunto de (fichero, linea) que
      # rg -g sobre un arbol generado, con la llamada de un adaptador rg.
      - name: Glob parity with ripgrep -g
        run: python3 evidence/rg-glob-parity/glob_parity.py

      # --setup contra un HOME falso: plan, pregunta, idempotencia, respaldo,
      # --undo exacto y errores de uso. Nunca toca el HOME real del runner.
      - name: Agent setup (--setup) end-to-end
        run: python3 evidence/setup/setup_check.py

      # Los mismos diferenciales contra un binario Debug (comprobacion de
      # limites encendida). ReleaseFast escondia una lectura fuera del slice en
      # la alineacion UTF-8 de la ventana de M9 (text[len]): la salida salia
      # bien por suerte y en Debug abortaba. Prefijo aparte para no pisar
      # zig-out. El lote usa el corpus_50 generado en el paso de M3.
      - name: Agent-native differentials (M3-M9, Debug bounds checks)
        run: |
          zig build -Doptimize=Debug --prefix zig-debug
          for t in batch provenance compact spill m9; do
            echo "== $t (Debug)"
            python3 evidence/agent-native/${t}_conformance.py --zgrep zig-debug/bin/zgrep
          done
          echo "== glob parity (Debug)"
          python3 evidence/rg-glob-parity/glob_parity.py --zgrep zig-debug/bin/zgrep

  windows-native:
    name: Native Windows Build, Tests & Oracle
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep --yes --no-progress

      - name: Add Git for Windows GNU grep
        shell: pwsh
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $gitUsrBin 'grep.exe'))) {
            throw "GNU grep not found at $gitUsrBin"
          }
          $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify native tools
        shell: pwsh
        run: |
          zig version
          grep --version | Select-Object -First 1
          rg --version | Select-Object -First 1

      - name: Build optimized Windows binaries
        run: zig build -Doptimize=ReleaseFast

      - name: Run unit tests
        run: zig build test --summary all

      - name: Run native Windows differential oracle
        run: zig build -Doptimize=ReleaseFast oracle --summary all

      - name: Smoke-test Unicode paths and ignore rules
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'zigrep windows 高速'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $root '.gitignore'),
            "skip.txt`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $root 'keep 你好.txt'),
            "needle`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $root 'skip.txt'),
            "needle`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          # Default path: the tree is a micro-tree (< 2 MB), so it is scanned
          # by the zero-thread fast path, which does not apply ignore files.
          # The Unicode/space path must still be returned.
          $result = & .\zig-out\bin\zigrep.exe -H -F needle $root
          if ($LASTEXITCODE -ne 0) { throw "zigrep exited $LASTEXITCODE" }
          if (($result -join "`n") -notmatch 'keep 你好\.txt') {
            throw "Unicode path was not returned: $result"
          }
          # --force-swarm restores the old swarm behaviour, which does apply
          # the .gitignore of the tree root.
          $swarm = & .\zig-out\bin\zigrep.exe --force-swarm -H -F needle $root
          if ($LASTEXITCODE -ne 0) { throw "zigrep --force-swarm exited $LASTEXITCODE" }
          if (($swarm -join "`n") -notmatch 'keep 你好\.txt') {
            throw "Unicode path was not returned by --force-swarm: $swarm"
          }
          if (($swarm -join "`n") -match 'skip\.txt') {
            throw "Git-ignored file was searched by --force-swarm: $swarm"
          }
