name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Static Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /usr/local
          echo "/usr/local/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Verify toolchain
        run: zig version

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build x86_64-linux (ReleaseFast, static)
        run: |
          mkdir -p dist/x86_64
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/zigrep dist/x86_64/zigrep
          strip dist/x86_64/zigrep 2>/dev/null || true
          tar -czf dist/zigrep-linux-x86_64.tar.gz -C dist/x86_64 zigrep

      - name: Build aarch64-linux (ReleaseFast, static)
        run: |
          mkdir -p dist/aarch64
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/zigrep dist/aarch64/zigrep
          tar -czf dist/zigrep-linux-aarch64.tar.gz -C dist/aarch64 zigrep

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum zigrep-linux-x86_64.tar.gz zigrep-linux-aarch64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zigrep-linux-x86_64.tar.gz
            dist/zigrep-linux-aarch64.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
