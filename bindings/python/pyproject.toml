[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziggrep"
version = "0.1.0"
description = "Kernels nativos de busqueda (ZigGrep) para Python, con ABI de C via ctypes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ziggrep = ["kernels.zig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
